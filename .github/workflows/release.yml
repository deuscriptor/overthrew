name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      folder: ${{ steps.version.outputs.folder }}
    steps:
      - name: Validate version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          version="${RELEASE#v}"
          # Semantic Versioning 2.0.0 (semver.org), as a POSIX ERE.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$RELEASE' is not a semantic version (MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])"
            exit 1
          fi
          prerelease=false
          [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
          # Workshop Tools addon folders use lowercase letters, digits and underscores.
          folder="overthrew_v$(tr 'A-Z' 'a-z' <<< "$version" | tr -c 'a-z0-9\n' '_')"
          {
            echo "tag=v$version"
            echo "prerelease=$prerelease"
            echo "folder=$folder"
          } >> "$GITHUB_OUTPUT"

      - name: Check that the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq "map(select(.ref == \"refs/tags/$TAG\")) | length")
          if [[ "$existing" != 0 ]]; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      folder: ${{ needs.prepare.outputs.folder }}

  release:
    name: Tag and release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/package

      - name: Tag commit
        id: tag
        run: |
          tag_sha=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="Release $TAG" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_sha" --silent

      - name: Create GitHub release
        env:
          ASSET: ${{ needs.build.outputs.asset }}
          FOLDER: ${{ needs.prepare.outputs.folder }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          notes="Workshop package: extract \`$ASSET\` into \`dota 2 beta/game/dota_addons/\` and publish the \`$FOLDER\` addon with Workshop Tools."
          gh release create "$TAG" "$RUNNER_TEMP/package/$ASSET" --verify-tag --title "$TAG" \
            --notes "$notes" --generate-notes "${flags[@]}"

      - name: Remove tag after a failed release
        if: failure() && steps.tag.outcome == 'success'
        run: gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
